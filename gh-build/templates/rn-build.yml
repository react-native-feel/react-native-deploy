# Managed by rn-build — https://github.com/rofi/react-native-deploy
#
# Runs React Native iOS and Android builds on GitHub-hosted runners. Every
# setting arrives as a workflow_dispatch input, so the CLI never has to rewrite
# this file; you can also run it by hand from the Actions tab.
#
# Secrets this workflow expects (created by `rn-build setup`):
#   iOS      RN_BUILD_IOS_DIST_P12, RN_BUILD_IOS_P12_PASSWORD, RN_BUILD_IOS_PROFILE
#   Android  RN_BUILD_ANDROID_KEYSTORE, RN_BUILD_ANDROID_STORE_PASSWORD,
#            RN_BUILD_ANDROID_KEY_ALIAS, RN_BUILD_ANDROID_KEY_PASSWORD

name: rn-build
run-name: "rn-build ${{ inputs.profile }} · ${{ inputs.platform }} · ${{ inputs.dispatch_id }}"

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Correlation id stamped into the run name by the CLI
        required: true
      profile:
        description: Build profile name (labelling only)
        default: production
      platform:
        description: ios | android | all
        default: all
      build_type:
        description: expo (run prebuild) | classic (native dirs are committed)
        default: expo
      node_version:
        default: "20"
      package_manager:
        description: npm | bun | yarn | pnpm — must match the committed lockfile
        default: npm
      env_json:
        description: JSON object of extra environment variables for the build
        default: "{}"

      # iOS
      ios_runner:
        default: macos-15
      scheme:
        description: Xcode scheme
        default: ""
      configuration:
        default: Release
      export_method:
        description: app-store | ad-hoc | development
        default: app-store
      team_id:
        default: ""
      bundle_id:
        default: ""
      profile_name:
        description: Provisioning profile name to sign with
        default: ""

      # Android
      android_runner:
        default: ubuntu-latest
      gradle_task:
        description: assembleRelease (APK) or bundleRelease (AAB)
        default: assembleRelease
      android_module:
        default: app

jobs:
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: ${{ inputs.ios_runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Apply build environment
        run: |
          echo '${{ inputs.env_json }}' \
            | node -e 'const o=JSON.parse(require("fs").readFileSync(0,"utf8")||"{}");for(const[k,v]of Object.entries(o))console.log(`${k}=${v}`)' \
            >> "$GITHUB_ENV"

      - name: Set up bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          case "${{ inputs.package_manager }}" in
            bun)  bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable || yarn install --frozen-lockfile ;;
            *)    npm ci || npm install ;;
          esac

      - name: Generate native project (expo prebuild)
        if: inputs.build_type == 'expo'
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Import signing certificate and provisioning profile
        env:
          IOS_DIST_P12: ${{ secrets.RN_BUILD_IOS_DIST_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.RN_BUILD_IOS_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.RN_BUILD_IOS_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_DIST_P12" ]; then
            echo "::error::RN_BUILD_IOS_DIST_P12 is not set. Run 'rn-build setup' to create signing secrets."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/rn-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$IOS_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$PROFILE_DIR/rn-build.mobileprovision"

          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>__METHOD__</string>
            <key>teamID</key><string>__TEAM_ID__</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict><key>__BUNDLE_ID__</key><string>__PROFILE_NAME__</string></dict>
          </dict>
          </plist>
          PLIST
          sed -i '' \
            -e "s|__METHOD__|${{ inputs.export_method }}|" \
            -e "s|__TEAM_ID__|${{ inputs.team_id }}|" \
            -e "s|__BUNDLE_ID__|${{ inputs.bundle_id }}|" \
            -e "s|__PROFILE_NAME__|${{ inputs.profile_name }}|" \
            "$RUNNER_TEMP/ExportOptions.plist"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "ios/${{ inputs.scheme }}.xcworkspace" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -archivePath "$RUNNER_TEMP/${{ inputs.scheme }}.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ inputs.team_id }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ inputs.profile_name }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              echo "::group::xcodebuild archive failed — last 200 lines"
              tail -n 200 "$RUNNER_TEMP/xcodebuild.log"
              echo "::endgroup::"
              exit 1
            }
          echo "Archive succeeded: $RUNNER_TEMP/${{ inputs.scheme }}.xcarchive"

      - name: Export .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.scheme }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.profile }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/rn-build.keychain-db" || true

  android:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ${{ inputs.android_runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply build environment
        run: |
          echo '${{ inputs.env_json }}' \
            | node -e 'const o=JSON.parse(require("fs").readFileSync(0,"utf8")||"{}");for(const[k,v]of Object.entries(o))console.log(`${k}=${v}`)' \
            >> "$GITHUB_ENV"

      - name: Set up bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          case "${{ inputs.package_manager }}" in
            bun)  bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable || yarn install --frozen-lockfile ;;
            *)    npm ci || npm install ;;
          esac

      - name: Generate native project (expo prebuild)
        if: inputs.build_type == 'expo'
        run: npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.RN_BUILD_ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::RN_BUILD_ANDROID_KEYSTORE is not set. Run 'rn-build setup' to create signing secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.RN_BUILD_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RN_BUILD_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RN_BUILD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          # android.injected.signing.* is honoured by AGP for any assemble/bundle
          # task, so this signs release builds without editing the app's Gradle.
          ./gradlew ":${{ inputs.android_module }}:${{ inputs.gradle_task }}" \
            --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          find "android/${{ inputs.android_module }}/build/outputs" \
            \( -name '*.apk' -o -name '*.aab' \) -exec cp {} "$RUNNER_TEMP/export/" \;
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.profile }}
          path: |
            ${{ runner.temp }}/export/*.apk
            ${{ runner.temp }}/export/*.aab
          if-no-files-found: error
          retention-days: 30
